# Bellek sinirlari: bu makinede 15 GB RAM var ve derleme sirasinda
# emulator da acik oluyor. Once -Xmx4G + 2G metaspace yaziyordu; Gradle
# daemon'u tek basina 6 GB'a kadar cikabiliyordu.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1g

# 12 cekirdek var ama whisper.cpp dort ABI icin kaynaktan derleniyor;
# sinirsiz paralellik butun RAM'i yiyor.
org.gradle.workers.max=4

android.useAndroidX=true
android.enableJetifier=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
