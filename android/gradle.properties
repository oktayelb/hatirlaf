# Bellek sinirlari: daemon tek basina 6 GB'a cikabiliyordu.
# whisper.cpp dort ABI icin kaynaktan derleniyor; sinirsiz paralellik
# butun RAM'i yiyor.
org.gradle.workers.max=3

# CPU tavani. Gradle daemon systemd kapsaminin DISINA kacabildigi icin
# cgroup sinirina guvenemiyoruz: ActiveProcessorCount JVM'e "12 degil 4
# cekirdegin var" dedirtiyor ve butun ic havuzlari (GC, JIT, worker)
# ona gore kuculuyor. Derleme yavaslar; makine kullanilabilir kalir.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:ActiveProcessorCount=4
kotlin.daemon.jvmargs=-Xmx1g -XX:ActiveProcessorCount=2

# Kotlin gorevleri projeler arasinda paralel kosmasin.
kotlin.parallel.tasks.in.project=false

android.useAndroidX=true
android.enableJetifier=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
